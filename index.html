<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>&nbsp;</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font:18px/1.5 system-ui,sans-serif}
.page{display:none;min-height:100vh;padding:48px 24px;flex-direction:column;align-items:center;justify-content:center}
.page.on{display:flex}
.col{width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.end{justify-content:flex-end}
input,select{font:inherit;padding:8px 10px;border:1px solid #888;border-radius:6px;background:#fff}
label{font-weight:400}
.go{border:0;background:none;cursor:pointer;padding:6px;display:flex}
.go:disabled{opacity:.25;cursor:default}
.go svg{width:36px;height:36px;stroke:#111;fill:none;stroke-width:2}
#sq{position:relative;background:#000;color:#fff;font-size:28px;line-height:1.4;text-align:center;display:flex;align-items:center;justify-content:center;padding-bottom:28px;user-select:none}
#bar{position:absolute;left:16px;right:16px;bottom:16px;height:6px;background:#fff;transform-origin:left}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
</style></head><body>

<section class="page" id="p-code"><form class="row" id="f-code" autocomplete="off">
 <input id="code" placeholder="code/code/código/kódigo" style="width:min(320px,70vw);text-align:center" required><button class="go" disabled></button></form></section>
<section class="page" id="p-consent"><div class="col"><div id="consent"></div><div class="row end"><button class="go" id="b-consent"></button></div></div></section>
<section class="page" id="p-prelim"><form class="col" id="f-prelim"><div class="col" id="prelim"></div><div class="row end"><button class="go"></button></div></form></section>
<section class="page" id="p-word"><div id="sq"><div id="w"></div><div id="bar"></div></div></section>
<section class="page" id="p-fill" style="justify-content:flex-start"><form class="col" id="f-fill"><p id="fi"></p><div class="col" id="fr"></div><div class="row end"><button class="go"></button></div></form></section>
<section class="page" id="p-wait"><div class="col"><p id="wt"></p>
 <form id="f-sleep" class="col" hidden><div class="col" id="sq-rows"></div><div id="slept"></div><div class="row end"><button class="go" disabled></button></div></form></div></section>
<section class="page" id="p-thanks"><p id="thanks" style="max-width:560px;text-align:center"></p></section>
<audio id="audio" src="Freedom_Dive.mp3" loop preload="auto"></audio>

<script>
document.querySelectorAll('.go').forEach(b=>b.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg>');
const $=id=>document.getElementById(id), body=document.body;
const show=id=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id));scrollTo(0,0)};
/* text from behaviour.json may use **bold**, *italic*, __underline__, ~~strike~~, \n and raw HTML tags */
const md=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>').replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>');
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const opts=l=>'<option value="">—</option>'+l.map((x,i)=>`<option value="${i+1}">${x}</option>`).join('');
let B,T,S={},rec={},events=[];
const API='https://script.google.com/macros/s/AKfycbw5bkTNK0mx4j4sCdDi--vX7eHUjU43L4YBl2zIXzZNKu9QP3qXw1qO2u7D_slM3UJ3/exec';
/* POST without headers = text/plain, which avoids a CORS preflight that Apps Script can't answer */
const save=async p=>{Object.assign(rec,p);
  for(let i=0;i<4;i++){try{const r=await (await fetch(API,{method:'POST',body:JSON.stringify({code:S.code,patch:p})})).json();if(r.ok||r.locked)return r}catch(e){console.error(e)}await new Promise(r=>setTimeout(r,1500))}
  alert('Could not save data - please check your connection.')};

/* 1 code */
const parse=c=>{c=c.trim().toLowerCase();const m=/^p([1-4])\d\d$/.exec(c);
  if(m)return{c,isP:true,lang:B.p[m[1]-1],f:+c.slice(1)%2?'distracted':'focused'};
  const k=Object.hasOwn(B.codes,c)&&B.codes[c];return k?{c,isP:false,lang:k[0],f:k[1]}:null};
$('code').oninput=()=>{$('f-code').querySelector('.go').disabled=!parse($('code').value)};
$('f-code').onsubmit=async e=>{
  e.preventDefault();
  const x=parse($('code').value); if(!x)return;
  S={code:x.c,isP:x.isP,T:B[x.lang],order:[x.f,x.f==='focused'?'distracted':'focused']}; T=S.T;
  rec=x.isP?await (await fetch(API+'?code='+encodeURIComponent(x.c))).json():{};
  if(rec.t24) return thanks();
  if(rec.start) return t24();
  const [h,...ps]=T.consent; $('consent').innerHTML=`<h2>${md(h)}</h2>`+ps.map(p=>`<p>${md(p)}</p>`).join(''); show('p-consent');
};

/* 2-3 consent, preliminary */
$('b-consent').onclick=()=>{
  $('prelim').innerHTML=T.prelim.map(([l,o],i)=>`<div class="row"><label>${md(l)}</label>`+
    (o?`<select name="${i}" required>${opts(o)}</select>`:`<input name="${i}" type="number" min="1" max="120" required>`)+'</div>').join('');
  $('f-prelim').querySelector('.go').disabled=true; show('p-prelim');
};
$('f-prelim').oninput=e=>{$('f-prelim').querySelector('.go').disabled=!$('f-prelim').checkValidity()};
$('f-prelim').onsubmit=async e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  await save({info:T.prelim.map((_,i)=>+f.get(i))});
  const t0={};
  for(const ph of S.order){ await words(ph); t0[ph]=await fill(T.words[ph].map((w,i)=>({w,i,ph})),T.fill0).then(a=>a[ph]); }
  await save({t0,start:new Date().toISOString()});
  t24();
};

/* 4 t0 */
async function words(ph){
  const L=T.words[ph], sq=$('sq'); show('p-word');
  const m=document.createElement('div'); m.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:28px/1.4 system-ui';
  m.innerHTML=L.map(w=>`<div><b>${w[0]}</b><br>${w[1]}</div>`).join(''); body.append(m);
  const side=Math.max(m.offsetWidth+80,m.firstChild.offsetHeight+28+60); m.remove();
  sq.style.width=sq.style.height=side+'px';
  sq.style.cursor=S.isP?'default':'pointer';
  const a=$('audio'); let raf;
  if(ph==='distracted'){
    a.currentTime=0; a.play().catch(()=>{}); let i=0,last=0;
    const tick=()=>{const t=a.currentTime; if(t<last)i=0; last=t;
      while(i<events.length&&events[i].time<=t){body.style.background=`hsl(${Math.random()*360|0},100%,50%)`;i++}
      raf=requestAnimationFrame(tick)}; tick();
  }
  for(const w of L){
    $('w').innerHTML=`<b>${w[0]}</b><br>${w[1]}`;
    const bar=$('bar'); bar.style.transition='none'; bar.style.transform='scaleX(1)'; bar.offsetWidth;
    bar.style.transition=`transform ${B.seconds}s linear`; bar.style.transform='scaleX(0)';
    await new Promise(r=>{const t=setTimeout(d,B.seconds*1000); if(!S.isP)sq.onclick=d; function d(){clearTimeout(t);sq.onclick=null;r()}});
  }
  if(ph==='distracted'){cancelAnimationFrame(raf);a.pause();body.style.background=''}
}
function fill(items,instr){ // items: [{w,i,ph}] -> {focused:[...],distracted:[...]} answers aligned to word order
  return new Promise(res=>{
    $('fi').innerHTML=md(instr); const o=shuffle(items);
    $('fr').innerHTML=o.map((x,k)=>`<div class="fr"><b>${x.w[0]}</b><input data-k="${k}" autocomplete="off"></div>`).join('');
    show('p-fill');
    $('f-fill').onsubmit=e=>{e.preventDefault(); const out={focused:[],distracted:[]};
      o.forEach((x,k)=>out[x.ph][x.i]=$('fr').querySelector(`[data-k="${k}"]`).value.trim()); res(out)};
  });
}

/* 5 t24 */
function t24(){
  $('wt').innerHTML=md(T.wait).replace('{code}','<b>'+S.code+'</b>');
  $('f-sleep').hidden=true; show('p-wait');
  const open=()=>{
    const hrs=[...Array(12)].map((_,i)=>i+1), mins=['00','15','30','45'];
    $('sq-rows').innerHTML=T.sleepQ.map((q,n)=>`<div class="row"><label>${md(q)}</label>
      <select data-n="${n}">${opts(hrs).replace('—',T.units[0])}</select><select data-n="${n}">${opts(mins).replace('—',T.units[1])}</select>
      <select data-n="${n}">${opts(['AM','PM']).replace('—','AM/PM')}</select></div>`).join('');
    $('f-sleep').hidden=false;
  };
  if(S.isP){ const at=Date.parse(rec.start)+B.waitHours*3600e3;
    const iv=setInterval(()=>{if(Date.now()>=at){clearInterval(iv);open()}},1000); if(Date.now()>=at){clearInterval(iv);open()} }
  else open();
}
const sel=()=>[...document.querySelectorAll('#sq-rows select')].map(s=>+s.value);
$('f-sleep').oninput=()=>{
  const v=sel(), ok=v.every(Boolean); $('f-sleep').querySelector('.go').disabled=!ok;
  if(!ok) return $('slept').innerHTML='';
  const t=i=>((v[i]%12)+(v[i+2]==2?12:0))*60+(v[i+1]-1)*15, d=(t(3)-t(0)+1440)%1440;
  $('slept').innerHTML=md(T.slept).replace('{h}',d/60|0).replace('{m}',d%60);
};
$('f-sleep').onsubmit=async e=>{
  e.preventDefault(); const v=sel(), mn=i=>(v[i]%12)*60+(v[i+1]-1)*15+(v[i+2]==2?720:0);
  const sleep=mn(0), wake=mn(3), dur=(wake-sleep+1440)%1440;
  const all=['focused','distracted'].flatMap(ph=>T.words[ph].map((w,i)=>({w,i,ph})));
  const ans=await fill(all,T.fill24);
  await save({sleep:dur,t24:ans}); thanks();
};
function thanks(){$('thanks').innerHTML=md(T.thanks);show('p-thanks')}

/* boot */
(async()=>{
  B=await (await fetch('behaviour.json')).json();
  events=(await (await fetch('freedom_dive_events.json')).json()).events;
  show('p-code');
})();
</script></body></html>
