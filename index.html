<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>&nbsp;</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#fff;color:#111;font:18px/1.5 system-ui,sans-serif}
.page{display:none;min-height:100vh;padding:48px 24px;flex-direction:column;align-items:center;justify-content:center}
.page.on{display:flex}
.col{width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.end{justify-content:flex-end}
input,select{font:inherit;padding:8px 10px;border:1px solid #888;border-radius:6px;background:#fff}
input.bad{border-color:#d00}
button{font:inherit}
.btn,.lang{padding:12px 20px;border:1px solid #000;border-radius:8px;background:#000;color:#fff;cursor:pointer;opacity:.55;transition:opacity .15s,transform .15s}
.btn:hover:not(:disabled),.lang:hover{opacity:1;transform:scale(1.05)}
.btn:disabled{opacity:.25;cursor:default}
.lang{width:260px;font-size:22px}
#langs{display:flex;flex-direction:column;gap:16px}
.go{border:0;background:none;cursor:pointer;padding:6px;display:flex}
.go:disabled{opacity:.25;cursor:default}
.go svg{width:36px;height:36px;stroke:#111;fill:none;stroke-width:2}
#btns{display:flex;gap:16px;justify-content:center;align-items:flex-start;margin-top:8px}
#btns>div{display:flex;flex-direction:column}
#ri{border-top-left-radius:0;border-top-right-radius:0;width:100%;text-align:center}
#sq{position:relative;background:#000;color:#fff;font-size:28px;line-height:1.4;text-align:center;display:flex;align-items:center;justify-content:center;padding-bottom:28px;user-select:none}
#bar{position:absolute;left:16px;right:16px;bottom:16px;height:6px;background:#fff;transform-origin:left}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
</style></head><body>

<section class="page on" id="p-lang"><div id="langs"></div></section>

<section class="page" id="p-info"><div class="col">
 <div id="txt"></div>
 <div id="btns">
  <div><button class="btn" id="rb"></button><input id="ri" autocomplete="off" hidden></div>
  <button class="btn" id="nb"></button>
 </div></div></section>

<section class="page" id="p-prelim"><form class="col" id="f-prelim"><div class="col" id="prelim"></div><div class="row end"><button class="go" disabled></button></div></form></section>

<section class="page" id="p-word"><div id="sq"><div id="w"></div><div id="bar"></div></div></section>

<section class="page" id="p-fill" style="justify-content:flex-start"><form class="col" id="f-fill"><p id="fi"></p><div class="col" id="fr"></div><div class="row end"><button class="go"></button></div></form></section>

<section class="page" id="p-wait"><div class="col"><p id="wt"></p>
 <form id="f-sleep" class="col" hidden><div class="col" id="sq-rows"></div><div id="slept"></div><div class="row end"><button class="go" disabled></button></div></form></div></section>

<section class="page" id="p-thanks"><p id="thanks" style="max-width:560px;text-align:center"></p></section>

<audio id="audio" src="Freedom_Dive.mp3" loop preload="auto"></audio>

<script>
/* ---- config ---- */
const API='https://script.google.com/macros/s/AKfycbw5bkTNK0mx4j4sCdDi--vX7eHUjU43L4YBl2zIXzZNKu9QP3qXw1qO2u7D_slM3UJ3/exec';
const SECONDS=10, WAIT_HOURS=12;
const LANGS=[['English','en'],['Nederlands','nl'],['Español','es'],['Papiamentu','pap']];

/* ---- helpers ---- */
document.querySelectorAll('.go').forEach(b=>b.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg>');
const $=id=>document.getElementById(id), body=document.body;
const show=id=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id));scrollTo(0,0)};
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const opts=(l,ph)=>`<option value="">${ph}</option>`+l.map((x,i)=>`<option value="${i+1}">${x}</option>`).join('');
let L,T,S={},events=[];

/* POST as text/plain: no CORS preflight (Apps Script can't answer one) */
async function post(b){
  for(let i=0;i<4;i++){
    try{const r=await (await fetch(API,{method:'POST',body:JSON.stringify(b)})).json(); if(r.ok)return r}catch(e){console.error(e)}
    await wait(1500);
  }
  alert('Could not save data - please check your connection.');
}
const save=patch=>post({code:S.code,patch});

/* ---- 1. language ---- */
LANGS.forEach(([name,k])=>{
  const b=document.createElement('button'); b.className='lang'; b.textContent=name;
  b.onclick=e=>{S={lang:k,cheat:e.ctrlKey}; T=L[k]; info()};   // ctrl+click = cheat mode (saved only on "new")
  $('langs').append(b);
});

/* ---- 2. consent + instructions + resume/new ---- */
const rb=$('rb'), nb=$('nb'), ri=$('ri'), CODE=/^p\d{3}$/;
function info(){
  $('txt').innerHTML=T.consent+T.instructions;
  rb.textContent=T.resume; nb.textContent=T.new; ri.placeholder=T.code;
  rb.disabled=nb.disabled=false; ri.hidden=true; ri.value=''; ri.classList.remove('bad');
  show('p-info');
}
ri.oninput=()=>{ri.classList.remove('bad'); rb.disabled=!CODE.test(ri.value.trim().toLowerCase())};
ri.onkeydown=e=>{if(e.key==='Enter'&&!rb.disabled)rb.click()};
rb.onclick=async()=>{
  if(ri.hidden){ri.hidden=false; rb.disabled=true; ri.focus(); return}
  const code=ri.value.trim().toLowerCase(); rb.disabled=true;
  let r={}; try{r=await (await fetch(API+'?code='+code)).json()}catch(e){}
  if(!r.found||!L[r.language]){ri.classList.add('bad'); return}
  S={code,lang:r.language,first:r.first,cheat:!!+r.cheat}; T=L[S.lang];
  if(r.t24_done) return thanks();
  if(r.t0_end){S.t0end=+r.t0_end; return t24()}
  r.age?runT0():prelim();
};
nb.onclick=async()=>{
  nb.disabled=true;
  const r=await post({action:'new',language:S.lang,cheat:S.cheat?1:0});
  if(!r){nb.disabled=false;return}
  S.code=r.code; S.first=r.first; prelim();
};

/* ---- 3. preliminary statistics ---- */
function prelim(){
  const f=$('f-prelim'), go=f.querySelector('.go');
  $('prelim').innerHTML=T.prelim.map(([l,o],i)=>`<div class="row"><label>${l}</label>`+
    (o?`<select name="q${i}" required>${opts(o,'—')}</select>`:`<input name="q${i}" type="number" min="1" max="120" required>`)+
    (i===4?`<input name="oth" placeholder="${T.specify}" hidden>`:'')+'</div>').join('');
  go.disabled=true; show('p-prelim');
  f.oninput=()=>{
    const x=f.elements.q4.value==='5', o=f.elements.oth;   // "other" is option 5 of school type
    o.hidden=!x; o.required=x; if(!x)o.value='';
    go.disabled=!f.checkValidity();
  };
  f.onsubmit=async e=>{
    e.preventDefault(); go.disabled=true;
    const g=n=>f.elements[n].value.trim();
    await save({caffeine:g('q0'),focus:g('q1'),age:g('q2'),gender:g('q3'),school_type:g('q4'),school_other:g('oth'),school_year:g('q5')});
    runT0();
  };
}

/* ---- 4. t0 ---- */
async function runT0(){
  const order=S.first==='distracted'?['distracted','focused']:['focused','distracted'], p={};
  for(const ph of order){
    await words(ph);
    const a=await fill(T[ph].map((w,i)=>({w,i,ph})),T.fill0);
    a[ph].forEach((v,i)=>p[`t0_${ph}_${i+1}`]=v);
  }
  S.t0end=Date.now(); p.t0_end=S.t0end;
  await save(p); t24();
}

async function words(ph){
  const list=T[ph], sq=$('sq'); show('p-word');
  const m=document.createElement('div'); m.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:28px/1.4 system-ui';
  m.innerHTML=list.map(w=>`<div><b>${w[0]}</b><br>${w[1]}</div>`).join(''); body.append(m);
  const side=Math.max(m.offsetWidth+80,m.firstChild.offsetHeight+28+60); m.remove();   // as small as fits
  sq.style.width=sq.style.height=side+'px';
  sq.style.cursor=S.cheat?'pointer':'default';
  const a=$('audio'); let raf;
  if(ph==='distracted'){
    a.currentTime=0; a.play().catch(()=>{});
    let i=0,last=0,hue=Math.random()*360;
    const tick=()=>{const t=a.currentTime; if(t<last)i=0; last=t;
      while(i<events.length&&events[i].time<=t){hue=(hue+90+Math.random()*180)%360; body.style.background=`hsl(${hue|0},100%,50%)`; i++}   // always a big hue jump
      raf=requestAnimationFrame(tick)}; tick();
  }
  for(const w of list){
    $('w').innerHTML=`<b>${w[0]}</b><br>${w[1]}`;
    const bar=$('bar'); bar.style.transition='none'; bar.style.transform='scaleX(1)'; bar.offsetWidth;
    bar.style.transition=`transform ${SECONDS}s linear`; bar.style.transform='scaleX(0)';
    await new Promise(r=>{const t=setTimeout(d,SECONDS*1000); if(S.cheat)sq.onclick=d; function d(){clearTimeout(t);sq.onclick=null;r()}});
  }
  if(ph==='distracted'){cancelAnimationFrame(raf);a.pause();body.style.background=''}
}

/* items: [{w,i,ph}] shown in random order -> {focused:[...],distracted:[...]} aligned to word order */
function fill(items,instr){
  return new Promise(res=>{
    $('fi').innerHTML=instr; const o=shuffle(items);
    $('fr').innerHTML=o.map((x,k)=>`<div class="fr"><b>${x.w[0]}</b><input data-k="${k}" autocomplete="off"></div>`).join('');
    show('p-fill');
    $('f-fill').onsubmit=e=>{e.preventDefault(); const out={focused:[],distracted:[]};
      o.forEach((x,k)=>out[x.ph][x.i]=$('fr').querySelector(`[data-k="${k}"]`).value.trim()); res(out)};
  });
}

/* ---- 5. t24 ---- */
function t24(){
  $('wt').innerHTML=T.wait.replace('{code}',S.code);
  $('f-sleep').hidden=true; show('p-wait');
  const open=()=>{
    $('sq-rows').innerHTML=T.sleep.map(q=>`<div class="row"><label>${q}</label>
      <select>${opts([...Array(12)].map((_,i)=>i+1),T.units[0])}</select>
      <select><option value="">${T.units[1]}</option>${[0,15,30,45].map(x=>`<option value="${x}">${String(x).padStart(2,"0")}</option>`).join('')}</select>
      <select><option value="">AM/PM</option><option>AM</option><option>PM</option></select></div>`).join('');
    $('f-sleep').hidden=false;
  };
  const at=S.t0end+WAIT_HOURS*3600e3;
  if(S.cheat||Date.now()>=at) return open();
  const iv=setInterval(()=>{if(Date.now()>=at){clearInterval(iv);open()}},1000);
}
const vals=()=>[...document.querySelectorAll('#sq-rows .row')].map(r=>[...r.querySelectorAll('select')].map(s=>s.value));
const mins=([h,m,a])=>(h%12)*60+ +m+(a==='PM'?720:0);
const slept=v=>(mins(v[1])-mins(v[0])+1440)%1440;
$('f-sleep').oninput=()=>{
  const v=vals(), ok=v.every(r=>r.every(x=>x!==''));
  $('f-sleep').querySelector('.go').disabled=!ok;
  if(!ok) return $('slept').innerHTML='';
  const d=slept(v); $('slept').innerHTML=T.slept.replace('{h}',d/60|0).replace('{m}',d%60);
};
$('f-sleep').onsubmit=async e=>{
  e.preventDefault(); const dur=slept(vals());
  const all=['focused','distracted'].flatMap(ph=>T[ph].map((w,i)=>({w,i,ph})));
  const a=await fill(all,T.fill24), p={sleep_minutes:dur,t24_done:Date.now()};
  for(const ph of ['focused','distracted']) a[ph].forEach((v,i)=>p[`t24_${ph}_${i+1}`]=v);
  await save(p); thanks();
};

/* ---- 6. thanks ---- */
function thanks(){$('thanks').innerHTML=T.thanks; show('p-thanks')}

/* ---- boot ---- */
(async()=>{
  L=await (await fetch('language_text.json')).json();
  events=(await (await fetch('freedom_dive_events.json')).json()).events;
})();
</script></body></html>
